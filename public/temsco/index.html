<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식회사 템스코 (TEMSCO) 투자제안서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        :root {
            --slide-width: 1123px;
            --slide-height: 794px;
        }
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #f1f5f9; 
            margin: 0; 
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            counter-reset: slide-page;
        }
        
        .slide { 
            width: var(--slide-width); 
            height: var(--slide-height); 
            background-color: #ffffff; 
            position: relative; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); 
            overflow: hidden; 
            flex-shrink: 0;
            border: 1px solid #cbd5e1;
            box-sizing: border-box;
            counter-increment: slide-page;
        }

        .slide::after {
            content: counter(slide-page);
            position: absolute;
            bottom: 24px;
            right: 48px;
            font-size: 15px;
            font-weight: 700;
            color: #94a3b8;
            z-index: 100;
        }

        .conic-donut { 
            background: conic-gradient(#1e3a8a 0% 40%, #3b82f6 40% 80%, #9ca3af 80% 100%); 
            border-radius: 50%; 
            position: relative;
        }
        .conic-donut::after {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 55%; height: 55%; background-color: white; border-radius: 50%;
        }

        @media print {
            @page {
                size: A4 landscape;
                margin: 0mm;
            }
            body { 
                background-color: white; 
                padding: 0; 
                margin: 0;
                gap: 0; 
                display: block; 
            }
            .slide { 
                width: 297mm !important; 
                height: 209.5mm !important;
                box-shadow: none; 
                border: none;
                margin: 0; 
                page-break-after: always; 
                page-break-inside: avoid;
            }
            #print-guide { display: none !important; }
        }
    </style>
</head>
<body>

    <div id="print-guide" class="bg-white border border-slate-300 p-4 rounded-lg flex justify-between items-center shadow-md mb-4" style="width: var(--slide-width);">
        <div>
            <h3 class="font-bold text-lg text-slate-800"><i class="fa-solid fa-file-pdf mr-2 text-red-500"></i>A4 PDF 출력 가이드</h3>
            <p class="text-sm text-slate-600">브라우저 인쇄(Ctrl+P 또는 Cmd+P) 실행 ➔ <b>[대상: PDF로 저장], [방향: 가로], [용지 크기: A4], [여백: 없음]</b>으로 설정하세요.</p>
        </div>
        <button onclick="window.print()" class="px-6 py-3 bg-blue-700 hover:bg-blue-800 text-white rounded font-bold transition flex items-center shadow-sm">
            <i class="fa-solid fa-print mr-2"></i>지금 PDF로 저장
        </button>
    </div>


</body>
</html>
